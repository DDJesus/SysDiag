name: Go CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and race detector
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22.x'
          cache: true
      - name: Run tests with race detector
        run: go test -race ./...

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22.x'
          cache: true
      - name: Compile CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o sysdiag${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/sysdiag

  package-windows:
    name: Package temporary Windows PR build
    needs: [test, cross-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22.x'
      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -o sysdiag.exe ./cmd/sysdiag
      - name: Prepare package and checksum
        run: |
          mkdir -p package
          cp sysdiag.exe README.md package/
          (cd package && zip ../sysdiag-windows-amd64-pr-${{ github.event.pull_request.number }}.zip sysdiag.exe README.md)
          sha256sum sysdiag-windows-amd64-pr-${{ github.event.pull_request.number }}.zip > sysdiag-windows-amd64-pr-${{ github.event.pull_request.number }}.zip.sha256
          unzip -l sysdiag-windows-amd64-pr-${{ github.event.pull_request.number }}.zip
          sha256sum -c sysdiag-windows-amd64-pr-${{ github.event.pull_request.number }}.zip.sha256
      - name: Upload temporary PR artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sysdiag-windows-amd64-pr-${{ github.event.pull_request.number }}
          path: |
            sysdiag-windows-amd64-pr-${{ github.event.pull_request.number }}.zip
            sysdiag-windows-amd64-pr-${{ github.event.pull_request.number }}.zip.sha256
          retention-days: 7
