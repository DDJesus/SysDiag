name: Manual Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version (for example 1.2.3; omit the v prefix)
        required: true
        type: string
      source_sha:
        description: Full 40-character commit SHA reachable from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Go tests and race detector
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Validate inputs and main ancestry
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch origin main
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - run: go test ./...
      - run: go test -race ./...

  windows-build-smoke:
    name: Windows amd64 build and smoke tests
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: '1.22.x'
      - name: Build Windows executable
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -o sysdiag.exe ./cmd/sysdiag
      - name: Smoke test executable
        shell: pwsh
        run: |
          ./sysdiag.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'sysdiag --version failed' }
          ./sysdiag.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'sysdiag --help failed' }
      - name: Record Go version
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV ('GO_VERSION=' + (go version))
      - name: Package verified executable
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $meta = @("version=$env:RELEASE_VERSION", "source_sha=$env:SOURCE_SHA", "go_version=$env:GO_VERSION", "target=windows/amd64", "workflow_run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID")
          $meta | Set-Content VERSION.txt
          $zip = "sysdiag-windows-amd64-v$env:RELEASE_VERSION.zip"
          Compress-Archive -Path sysdiag.exe, README.md, VERSION.txt -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "$zip.sha256"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try { $names = @($archive.Entries | ForEach-Object FullName) } finally { $archive.Dispose() }
          foreach ($expected in @('sysdiag.exe','README.md','VERSION.txt')) { if ($names -notcontains $expected) { throw "Missing $expected in ZIP" } }
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $hash) { throw 'ZIP checksum verification failed' }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: verified-release-assets
          path: |
            sysdiag-windows-amd64-v${{ inputs.version }}.zip
            sysdiag-windows-amd64-v${{ inputs.version }}.zip.sha256
          retention-days: 2

  draft-release:
    name: Create owner-approved draft release
    needs: [verify, windows-build-smoke]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: verified-release-assets
      - name: Revalidate release identity and collisions
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch origin main --tags
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          tag="v$RELEASE_VERSION"
          ! git show-ref --verify --quiet "refs/tags/$tag"
          remote_tag=$(git ls-remote --tags origin "refs/tags/$tag")
          if [[ -n "$remote_tag" ]]; then echo "Tag $tag already exists" >&2; exit 1; fi
          test -f "sysdiag-windows-amd64-v$RELEASE_VERSION.zip"
          sha256sum -c "sysdiag-windows-amd64-v$RELEASE_VERSION.zip.sha256"
      - name: Create immutable tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          tag="v$RELEASE_VERSION"
          git tag -a "$tag" "$SOURCE_SHA" -m "SysDiag $tag"
          git push origin "refs/tags/$tag"
          gh release create "$tag" "sysdiag-windows-amd64-v$RELEASE_VERSION.zip" "sysdiag-windows-amd64-v$RELEASE_VERSION.zip.sha256" --draft --verify-tag --target "$SOURCE_SHA" --title "SysDiag $tag" --notes "Verified Windows amd64 release. Source commit: $SOURCE_SHA. Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"


