name: Manual Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version (for example 1.2.3; omit the v prefix)
        required: true
        type: string
      source_sha:
        description: Full 40-character commit SHA reachable from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request on trusted main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Validate version, commit, tag, and Release object
        id: validate
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$RELEASE_VERSION" =~ $semver_regex ]] || { echo 'Invalid strict SemVer version' >&2; exit 1; }
          [[ "$SOURCE_SHA_INPUT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Source SHA must be exactly 40 hexadecimal characters' >&2; exit 1; }
          source_sha=$(printf '%s' "$SOURCE_SHA_INPUT" | tr '[:upper:]' '[:lower:]')
          git cat-file -e "$source_sha^{commit}"
          git merge-base --is-ancestor "$source_sha" origin/main
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag" || [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
            echo "Tag $tag already exists" >&2; exit 1
          fi
          status=$(curl --silent --show-error --output /tmp/release.json --write-out '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          if [[ "$status" == 200 ]]; then echo "Release $tag already exists" >&2; exit 1; fi
          if [[ "$status" != 404 ]]; then echo "Release lookup failed with HTTP $status" >&2; exit 1; fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  verify:
    name: Go tests and race detector
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22.x'
          cache: true
      - run: go test ./...
      - run: go test -race ./...

  windows-build-smoke:
    name: Windows amd64 build and smoke tests
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22.x'
      - name: Build Windows executable
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: go build -trimpath -ldflags "-X main.ToolVersion=$env:RELEASE_VERSION -X main.SourceCommit=$env:SOURCE_SHA" -o sysdiag.exe ./cmd/sysdiag
      - name: Smoke test executable
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          $versionOutput = ./sysdiag.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'sysdiag --version failed' }
          $expectedVersion = "sysdiag version $env:RELEASE_VERSION (windows/amd64, commit $env:SOURCE_SHA)"
          if ($versionOutput.Trim() -cne $expectedVersion) { throw "Version metadata mismatch. Expected '$expectedVersion'; got '$versionOutput'" }
          ./sysdiag.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'sysdiag --help failed' }
      - name: Record Go version
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV ('GO_VERSION=' + (go version))
      - name: Package verified executable
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          $meta = @("version=$env:RELEASE_VERSION", "source_sha=$env:SOURCE_SHA", "go_version=$env:GO_VERSION", "target=windows/amd64", "workflow_run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID")
          $meta | Set-Content VERSION.txt
          $zip = "sysdiag-windows-amd64-v$env:RELEASE_VERSION.zip"
          Compress-Archive -Path sysdiag.exe, README.md, VERSION.txt -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "$zip.sha256"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try { $names = @($archive.Entries | ForEach-Object FullName) } finally { $archive.Dispose() }
          $expected = @('sysdiag.exe','README.md','VERSION.txt')
          if ($names.Count -ne $expected.Count -or @($names | Where-Object { $_ -notin $expected }).Count -gt 0 -or @($expected | Where-Object { $_ -notin $names }).Count -gt 0) { throw "Unexpected ZIP entries: $($names -join ', ')" }
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $hash) { throw 'ZIP checksum verification failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-assets
          path: |
            sysdiag-windows-amd64-v${{ needs.validate.outputs.version }}.zip
            sysdiag-windows-amd64-v${{ needs.validate.outputs.version }}.zip.sha256
          retention-days: 2

  draft-release:
    name: Create owner-approved draft release
    needs: [validate, verify, windows-build-smoke]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      # Environment approval is evaluated before any job steps, including checkout/download.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-assets
      - name: Revalidate release identity and collisions after approval
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$RELEASE_VERSION" =~ $semver_regex ]] || { echo 'Invalid strict SemVer version' >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid validated source SHA' >&2; exit 1; }
          git fetch origin main --tags
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag" || [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
            echo "Tag $tag already exists" >&2; exit 1
          fi
          status=$(curl --silent --show-error --output /tmp/release.json --write-out '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          if [[ "$status" == 200 ]]; then echo "Release $tag already exists" >&2; exit 1; fi
          if [[ "$status" != 404 ]]; then echo "Release lookup failed with HTTP $status" >&2; exit 1; fi
          unzip -Z1 "sysdiag-windows-amd64-v$RELEASE_VERSION.zip" > /tmp/zip-entries.txt
          printf '%s\n' sysdiag.exe README.md VERSION.txt > /tmp/expected-entries.txt
          diff -u <(sort /tmp/expected-entries.txt) <(sort /tmp/zip-entries.txt)
          sha256sum -c "sysdiag-windows-amd64-v$RELEASE_VERSION.zip.sha256"
      - name: Create immutable tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          tag="v$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$SOURCE_SHA" -m "SysDiag $tag"
          git push origin "refs/tags/$tag"
          gh release create "$tag" "sysdiag-windows-amd64-v$RELEASE_VERSION.zip" "sysdiag-windows-amd64-v$RELEASE_VERSION.zip.sha256" --draft --verify-tag --target "$SOURCE_SHA" --title "SysDiag $tag" --notes "Verified Windows amd64 release. Source commit: $SOURCE_SHA. Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

