<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrastructure Explorer — Canonical SysDiag Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="ops-theme">
    <!-- Top Ops Header -->
    <header class="app-header">
        <div class="header-left">
            <div class="app-logo">
                <span class="logo-icon">◈</span>
                <span class="logo-title">INFRASTRUCTURE EXPLORER</span>
                <span class="logo-version">PHASE 3: SPATIAL NAVIGATION</span>
            </div>
            
            <div class="nav-controls">
                <button class="nav-btn" id="btn-nav-back" title="Navigate Up Hierarchy" disabled>
                    <span class="btn-icon">↑</span> BACK
                </button>
                <div class="breadcrumbs-container" id="breadcrumbs">
                    <span class="crumb-item crumb-active">
                        <span class="crumb-type">ROOT:</span>
                        <span class="crumb-label">Awaiting Report Ingestion</span>
                    </span>
                </div>
            </div>
        </div>

        <div class="header-right">
            <div class="search-box-container">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-filter" placeholder="Search adapters, services, findings (e.g. Wi-Fi, TrustedInstaller)..." autocomplete="off" />
                </div>
                <div class="search-dropdown-menu" id="search-dropdown" style="display: none;"></div>
            </div>

            <div class="ingest-controls">
                <select id="sample-select" class="ops-select" title="Load Sample Canonical Report">
                    <option value="" disabled selected>Load Sample Report...</option>
                    <option value="sysdiag_report_workstation_sanitized.json">Workstation (9/9 Probes, Services Info Finding)</option>
                    <option value="sysdiag_report_desktop_sanitized.json">Desktop (Storage &amp; Network Probes)</option>
                </select>

                <input type="file" id="file-input" accept=".json,application/json" style="display: none;" />
                <button class="ops-btn btn-primary" id="btn-open-file">
                    <span class="btn-icon">⇪</span> IMPORT JSON
                </button>
            </div>
        </div>
    </header>

    <!-- Schema Validation & Status Alert Banner -->
    <div id="validation-banner" class="val-banner" style="display: none;"></div>

    <!-- Main Operational Workspace -->
    <main class="main-workspace">
        <!-- Topology Visualization Stage -->
        <section class="topology-panel" id="topology-container">
            <!-- GraphRenderer mounts SVG canvas here -->
        </section>

        <!-- Right-side Detail Inspector & Evidence Chain Viewer -->
        <aside class="inspector-panel" id="inspector-container">
            <!-- DetailInspector mounts content here -->
        </aside>
    </main>

    <!-- Drag & Drop Ingestion Overlay Zone -->
    <div id="drop-zone" class="drop-overlay">
        <div class="drop-box">
            <div class="drop-icon">⇣</div>
            <div class="drop-title">DROP CANONICAL SYSDIAG JSON REPORT HERE</div>
            <div class="drop-sub">Validates against SysDiag Schema 1.0.0 and materializes infrastructure graph</div>
        </div>
    </div>

    <!-- Bottom Status & Telemetry Bar -->
    <footer class="app-footer" id="status-bar">
        <div class="status-item"><span class="s-key">STATUS:</span> <span class="s-val">READY</span></div>
        <div class="status-item"><span class="s-key">MODE:</span> <span class="s-val s-val-readonly">READ-ONLY OBSERVATIONAL</span></div>
    </footer>

    <!-- Main Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
